<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link href="css/app.css" rel="stylesheet" />
    <link href="FezWeb.styles.css" rel="stylesheet" />
</head>

<body>

    <div id="app">
        <div id="loading" style="display: table-cell; margin: auto; width:100vw; height:100vh; vertical-align: middle; background: #ffcc10;">
            <div style="display: block; margin: auto; width: 9em; color: white;font-family: 'Segoe UI', sans-serif;">
                <div style="text-align: center; font-size: 0.85em;">Made with<br/><a href="https://github.com/kniEngine/kni"><img src="kni.png" border="0" alt="Kni"></a></div>
                <div style="text-align: center; font-size: 1.8em;">loading&nbsp;<marquee style="width:0.9em; vertical-align: bottom;">.&nbsp;.&nbsp;.&nbsp;&nbsp;&nbsp;</marquee></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">x</a>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module">
        import { BrotliDecode } from './js/decode.min.js';
        window.BrotliDecode = BrotliDecode;
        // Set this to enable Brotli (.br) decompression on static webServers
        // that don't support content compression and http://.
        var enableBrotliDecompression = false;
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity)
            {
                if (enableBrotliDecompression === true && type !== 'dotnetjs' && location.hostname !== 'localhost')
                {
                    return (async function()
                    {
                        const response = await fetch(defaultUri + '.br', { cache: 'no-cache' });
                        if (!response.ok)
                            throw new Error(response.statusText);
                        const originalResponseBuffer = await response.arrayBuffer();
                        const originalResponseArray = new Int8Array(originalResponseBuffer);
                        const contentType = (type === 'dotnetwasm')
                                          ? 'application/wasm'
                                          : 'application/octet-stream';
                        const decompressedResponseArray = BrotliDecode(originalResponseArray);
                        return new Response(decompressedResponseArray,
                                            { headers: { 'content-type': contentType }
                                   });
                    })();
                }
            }
        });
    </script>

    <script src="_content/nkast.Wasm.JSInterop/js/JSObject.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Window.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Document.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Navigator.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Gamepad.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Dom/js/Media.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XHR/js/XHR.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/Canvas.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Canvas/js/CanvasGLContext.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.Audio/js/Audio.10.0.3.js"></script>
    <script src="_content/nkast.Wasm.XR/js/XR.10.0.3.js"></script>

    <script>
        function tickJS()
        {
            window.theInstance.invokeMethod('TickDotNet');
            window.requestAnimationFrame(tickJS);
        }

        // Key/value store for the game's save files (IndexedDB), see PersistentStorage.cs.
        window.fezStore = (() =>
        {
            let dbPromise = null;
            const open = () =>
            {
                if (!dbPromise)
                {
                    dbPromise = new Promise((resolve, reject) =>
                    {
                        const r = indexedDB.open('fez-web', 1);
                        r.onupgradeneeded = () => r.result.createObjectStore('files');
                        r.onsuccess = () => resolve(r.result);
                        r.onerror = () => reject(r.error);
                    });
                }
                return dbPromise;
            };
            const run = async (mode, op) =>
            {
                const db = await open();
                return new Promise((resolve, reject) =>
                {
                    const t = db.transaction('files', mode);
                    const req = op(t.objectStore('files'));
                    t.oncomplete = () => resolve(req ? req.result : undefined);
                    t.onerror = () => reject(t.error);
                    t.onabort = () => reject(t.error);
                });
            };
            return {
                keys: () => run('readonly', s => s.getAllKeys()),
                get: (k) => run('readonly', s => s.get(k)),
                put: (k, v) => run('readwrite', s => s.put(v, k)),
                remove: (k) => run('readwrite', s => s.delete(k)),
                // ask the browser not to evict the data when storage runs low
                requestPersistence: async () => (navigator.storage && navigator.storage.persist) ? await navigator.storage.persist() : false
            };
        })();

        const flushSaves = () => { if (window.theInstance) window.theInstance.invokeMethodAsync('FlushSaves'); };
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSaves(); });
        window.addEventListener('pagehide', flushSaves);

        // Internal render size. FEZ is pixel art: rendering at most `res` lines (default 720) and letting the browser scale the
        // canvas up is much cheaper on the GPU than a native-resolution backbuffer. ?res=0 renders at the native window size.
        window.hasFlag = (name) => new URLSearchParams(location.search).has(name);

        window.getRenderSize = () =>
        {
            var holder = document.getElementById('canvasHolder');
            var w = holder.clientWidth, h = holder.clientHeight;
            var q = new URLSearchParams(location.search).get('res');
            var res = q === null ? 720 : parseInt(q, 10);
            if (res > 0 && h > res)
            {
                w = Math.round(w * res / h);
                h = res;
            }
            return [w, h];
        };

        window.initRenderJS = (instance) =>
        {
            window.theInstance = instance;

            // set initial canvas size
            var canvas = document.getElementById('theCanvas');
            var size = window.getRenderSize();
            canvas.width = size[0];
            canvas.height = size[1];
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.imageRendering = 'pixelated';
            // disable context menu on right click
            canvas.addEventListener("contextmenu", e => e.preventDefault());

            // begin game loop
            window.requestAnimationFrame(tickJS);
        };

        window.addEventListener("keydown", function(event)
        {
            // Prevent Arrows Keys and Spacebar scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            if ([32, 37, 38, 39, 40].indexOf(event.keyCode) > -1)
                event.preventDefault();
        });
        window.addEventListener("wheel", function(event)
        {
            // Prevent Mousewheel scrolling the outer page
            // when running inside an iframe. e.g: itch.io embedding.
            event.preventDefault();
        }, { passive: false });
    </script>
</body>

</html>
